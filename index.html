<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Yayla</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #f1e9d8;
	border-radius: 0.75rem;
	border: 3px solid #54402a;
	color: #33281a;
	max-width: 34rem;
	max-height: 90vh;
	overflow-y: auto;
	text-align: left;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	padding: 1rem 1.25rem;
	z-index: 1;
}

#status-notice h2 { font-size: 1.15rem; margin: 0 0 0.5rem; }
#status-notice ol { margin: 0.4rem 0 0.8rem 1.2rem; padding: 0; }
#status-notice li { margin: 0.2rem 0; }
#status-notice code { background: #e2d6bd; border-radius: 0.25rem; padding: 0 0.25rem; }
#status-notice .other-lang { border-top: 1px solid #bfae8e; margin-top: 0.8rem; padding-top: 0.6rem; font-size: 0.9rem; opacity: 0.85; }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":236836,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// Yayla (F14): a calm, bilingual explanation when the browser has no WebGL 2
	// (usually hardware acceleration is off), instead of a raw "WebGL2 missing".
	function hasWebGL2() {
		try {
			const c = document.createElement('canvas');
			return !!(window.WebGL2RenderingContext && c.getContext('webgl2'));
		} catch (e) {
			return false;
		}
	}

	const WEBGL2_HELP = {
		tr: {
			title: 'Tarayıcın şu an 3D çizemiyor (WebGL 2 kapalı)',
			intro: 'Yayla bilgisayarının ekran kartını kullanır. Çoğu zaman tek bir ayar yeter:',
			steps: [
				'Chrome / Edge: Ayarlar → Sistem → <b>Kullanılabilir olduğunda grafik hızlandırmayı kullan</b> seçeneğini aç.',
				'Tarayıcıyı tamamen kapatıp yeniden aç, sonra bu sayfayı yenile.',
				'Hâlâ olmazsa <code>chrome://gpu</code> sayfasında "WebGL2" satırına bak; ya da Firefox ile dene.',
				'Telefonda: tarayıcını güncelle; düşük güç modunu kapatmak da yardımcı olabilir.',
			],
			outro: 'Acele yok — çay demlenirken bir kez denemen yeter.',
		},
		en: {
			title: 'Your browser can\'t draw 3D right now (WebGL 2 is off)',
			intro: 'Yayla uses your graphics card. Usually one setting fixes it:',
			steps: [
				'Chrome / Edge: Settings → System → turn on <b>Use graphics acceleration when available</b>.',
				'Fully close and reopen the browser, then reload this page.',
				'Still nothing? Check the "WebGL2" line on <code>chrome://gpu</code>, or try Firefox.',
				'On a phone: update your browser; turning off battery saver can help too.',
			],
			outro: 'No rush — one try while the tea brews is enough.',
		},
	};

	function showWebGL2Help() {
		const first = (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en';
		const second = first === 'tr' ? 'en' : 'tr';
		const block = (t, cls) => {
			const steps = t.steps.map((s) => `<li>${s}</li>`).join('');
			return `<div class="${cls}"><h2>${t.title}</h2><p>${t.intro}</p><ol>${steps}</ol><p>${t.outro}</p></div>`;
		};
		statusNotice.innerHTML = block(WEBGL2_HELP[first], '') + block(WEBGL2_HELP[second], 'other-lang');
		setStatusMode('notice');
		initializing = false;
	}

	if (!hasWebGL2()) {
		showWebGL2Help();
		return;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
